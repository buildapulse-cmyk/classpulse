<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassPulse — Your classes</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F6F8FB;color:#12305A}</style>
</head>
<body data-role="teacher">
<div id="page" hidden>
<header style="background: #12305A; padding: 0 24px">
<div style="max-width: 1200px; margin: 0 auto; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; box-sizing: border-box">
<span style="display: flex; align-items: center; gap: 10px"><img src="images/logo-mark-light.svg" alt="" width="32" height="32"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF">Class<span style="color: #FFC23D">Pulse</span></span><span style="margin-left: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #FFC23D; font-size: 13px; font-weight: 700">Teacher</span></span>
<div style="display: flex; align-items: center; gap: 14px; color: #FFFFFF; font-size: 14px"><span id="who"></span><button type="button" id="logout-btn" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 600; cursor: pointer">Log out</button></div>
</div>
</header>
<main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px">Your classes</h1>
<p style="margin: 0; color: #157F3B; font-weight: 600">You're logged in ✓</p>
<p style="margin: 0; color: #5B6472">Next step: all classes grouped as Creche, Kindergarten, Primary and JHS. You will pick your class and enter its PIN to open it.</p>
</main>
</div>
<script type="module" src="js/welcome.js"></script>
</body>
</html>
