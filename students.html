<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClassPulse helps teachers record attendance and scores and follow each student's progress over the term.">
<title>ClassPulse — my students</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5AA8}a:hover{color:#12305A}
.student-card{background:#FFFFFF;border:1px solid #E2E7EF;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;font-family:inherit;color:#12305A;cursor:pointer}
.student-card:hover,.student-card:focus-visible{border-color:#1E5AA8;box-shadow:0 0 0 3px #E6EEFA;outline:none}
dialog{border:none;border-radius:20px;padding:0;width:min(720px,92vw);color:#12305A}
dialog::backdrop{background:rgba(11,31,61,0.55)}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F6F8FB; font-family: Inter, system-ui, sans-serif; color: #12305A">
<header style="background: #12305A; padding: 0 24px">
<div style="max-width: 1200px; margin: 0 auto; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 10px 0; box-sizing: border-box">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none"><img src="images/logo-mark-light.svg" alt="" width="32" height="32"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF">Class<span style="color: #FFC23D">Pulse</span></span></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
<a href="index.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Dashboard</a>
<a href="attendance.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Attendance</a>
<a href="record-scores.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Record scores</a>
<a href="topics.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Topics</a>
<a href="students.html" aria-current="page" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.12); box-shadow: inset 0 -3px 0 #FFC23D">Students</a>
<a href="report-card.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Report cards</a></nav>
<div style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; font-size: 14px"><span style="width: 32px; height: 32px; border-radius: 50%; background: #F2A300; color: #12305A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AM</span>Mrs. A. Mensah</div>
</div>
</header>
<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px">My students</h1>
<p style="margin: 0; font-size: 15px; color: #5B6472">Students in the classes you teach. Click a card to see their score history.</p>
</div>
<form id="filters" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 180px"><label for="f-class" style="font-size: 14px; font-weight: 600">Class</label><select id="f-class" style="height: 46px; padding: 0 12px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 15px; font-family: inherit; background: #FFFFFF"><option value="all">All my classes</option><option>JHS 2A</option><option>JHS 2B</option><option>JHS 3A</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 180px"><label for="f-subject" style="font-size: 14px; font-weight: 600">Subject</label><select id="f-subject" style="height: 46px; padding: 0 12px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 15px; font-family: inherit; background: #FFFFFF"><option value="all">All my subjects</option><option>Mathematics</option><option>Integrated Science</option></select></div>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; background: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer"><input id="f-attention" type="checkbox"> Only students who need attention</label>
</form>
<p id="result-count" aria-live="polite" style="margin: 0; font-size: 14px; color: #5B6472"></p>
<div id="student-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px"></div>
</main>
</div>
<dialog id="student-dialog" aria-labelledby="dlg-name">
<div style="padding: 28px; display: flex; flex-direction: column; gap: 20px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="dlg-name" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px"></h2><p id="dlg-meta" style="margin: 0; font-size: 14px; color: #5B6472"></p></div>
<button type="button" id="dlg-close" aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #C9D2DF; background: #FFFFFF; color: #12305A; font-size: 22px; cursor: pointer">×</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #5B6472">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #1E5AA8"></span>Class exercise</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #5B3BA8"></span>Homework</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #F2A300"></span>Class test</span>
</div>
<div id="dlg-chart" role="img" style="display: flex; align-items: flex-end; gap: 3%; height: 220px; padding: 0 4px; border-bottom: 2px solid #E2E7EF"></div>
<div id="dlg-labels" style="display: flex; gap: 3%; padding: 0 4px; margin-top: -12px"></div>
<div style="overflow-x: auto"><table style="width: 100%; min-width: 480px; border-collapse: collapse; font-size: 14px"><thead><tr style="text-align: left; color: #5B6472; font-size: 13px"><th style="padding: 8px">Date</th><th style="padding: 8px">Type</th><th style="padding: 8px">Topic</th><th style="padding: 8px; text-align: right">Score</th></tr></thead><tbody id="dlg-rows"></tbody></table></div>
</div>
</dialog>
<script src="js/students.js"></script>
</body>
</html>
