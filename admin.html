<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClassPulse admin page: add, switch off and manage the schools that use ClassPulse.">
<title>ClassPulse — admin</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #F6F8FB; color: #12305A; }
a { color: #1E5AA8; } a:hover { color: #12305A; }
h1, h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
.card { background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 16px; padding: 24px; }
.field { display: flex; flex-direction: column; gap: 6px; }
label, legend { font-size: 14px; font-weight: 600; }
input[type="text"], input[type="email"] { height: 46px; padding: 0 12px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 15px; font-family: inherit; box-sizing: border-box; width: 100%; }
.btn { height: 46px; padding: 0 18px; border-radius: 10px; border: none; font-weight: 700; font-size: 14px; font-family: inherit; cursor: pointer; }
.btn-gold { background: #F2A300; color: #12305A; }
.btn-navy { background: #12305A; color: #FFFFFF; }
.btn-line { background: #FFFFFF; color: #12305A; border: 1px solid #C9D2DF; height: 40px; font-weight: 600; font-size: 13px; }
.btn-danger { background: #FFFFFF; color: #8F1D15; border: 1px solid #F0B0AA; height: 40px; font-weight: 600; font-size: 13px; }
.btn:disabled { opacity: 0.6; cursor: wait; }
.pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tile { flex: 1 1 180px; background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.tile strong { font-family: 'Space Grotesk', sans-serif; font-size: 30px; }
</style>
</head>
<body>
<div id="page" hidden>
<header style="background: #12305A; padding: 0 24px">
<div style="max-width: 1200px; margin: 0 auto; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; box-sizing: border-box">
<span style="display: flex; align-items: center; gap: 10px"><img src="images/logo-mark-light.svg" alt="" width="32" height="32"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF">Class<span style="color: #FFC23D">Pulse</span></span><span class="pill" style="margin-left: 8px; background: #F2A300; color: #12305A">Admin</span></span>
<div style="display: flex; align-items: center; gap: 14px; color: #FFFFFF; font-size: 14px"><span id="who"></span><button type="button" id="logout-btn" class="btn" style="height: 40px; background: transparent; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.4)">Log out</button></div>
</div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="font-size: 32px">Schools</h1>
<p style="margin: 0; color: #5B6472">Add schools, open any school, and switch schools off or remove them.</p>
</div>
<a href="simulate.html" style="align-self: flex-start; display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; background: #FFF4D6; color: #6B4E00; font-weight: 700; font-size: 14px; text-decoration: none; border: 1px solid #F5D98A">Practice data (simulation) →</a>

<div id="tiles" style="display: flex; flex-wrap: wrap; gap: 16px"></div>

<section class="card" style="display: flex; flex-direction: column; gap: 18px">
<h2 style="font-size: 22px">Add a school</h2>
<form id="add-form" style="display: flex; flex-direction: column; gap: 16px" novalidate>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div class="field"><label for="s-name">School name</label><input id="s-name" type="text" placeholder="e.g. Winneba Methodist School" required></div>
<div class="field"><label for="s-town">Town</label><input id="s-town" type="text" placeholder="e.g. Winneba"></div>
</div>
<fieldset style="border: 1px solid #E2E7EF; border-radius: 12px; padding: 12px 16px; margin: 0; display: flex; flex-wrap: wrap; gap: 18px">
<legend style="padding: 0 6px">Levels at this school</legend>
<label style="display: flex; align-items: center; gap: 8px; font-weight: 500; min-height: 32px"><input type="checkbox" name="level" value="Creche" checked> Creche <span style="color: #5B6472">(1–2)</span></label>
<label style="display: flex; align-items: center; gap: 8px; font-weight: 500; min-height: 32px"><input type="checkbox" name="level" value="Kindergarten" checked> Kindergarten <span style="color: #5B6472">(KG 1–2)</span></label>
<label style="display: flex; align-items: center; gap: 8px; font-weight: 500; min-height: 32px"><input type="checkbox" name="level" value="Primary" checked> Primary <span style="color: #5B6472">(1–6)</span></label>
<label style="display: flex; align-items: center; gap: 8px; font-weight: 500; min-height: 32px"><input type="checkbox" name="level" value="JHS" checked> JHS <span style="color: #5B6472">(1–3)</span></label>
<label style="flex-basis: 100%; display: flex; align-items: center; gap: 8px; font-weight: 500; min-height: 32px; color: #12305A"><input type="checkbox" id="make-classes" checked> Create the standard classes for these levels (Creche 1 … JHS 3). Streams like JHS 2A can be added later.</label>
</fieldset>
<h3 style="margin: 4px 0 0; font-size: 16px">Headmaster's login</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-items: end">
<div class="field"><label for="h-name">Headmaster's full name</label><input id="h-name" type="text" placeholder="e.g. Mr. Kofi Mensah" required></div>
<div class="field"><label for="h-email">Headmaster's email</label><input id="h-email" type="email" placeholder="headmaster@school.edu.gh" required></div>
<div class="field"><label for="h-pass">Starting password</label>
<div style="display: flex; gap: 8px"><input id="h-pass" type="text" autocomplete="off" required style="flex: 1"><button type="button" id="gen-btn" class="btn btn-line" style="height: 46px">New</button></div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<button type="submit" id="add-btn" class="btn btn-gold">Add school</button>
<p id="add-status" role="status" style="margin: 0; font-weight: 600"></p>
</div>
</form>
<div id="new-login" hidden style="background: #E3F4E8; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px"></div>
</section>

<section class="card" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="font-size: 22px">All schools</h2>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500"><input type="checkbox" id="show-removed"> Show removed schools</label>
</div>
<div id="school-list" aria-live="polite"><p style="color: #5B6472">Loading schools…</p></div>
<p id="list-status" role="status" style="margin: 0; font-weight: 600"></p>
</section>
</main>
</div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
