<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClasPules helps schools follow every student's progress — for teachers, the headmaster and parents.">
<title>ClasPules — log in</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#12305A">
<link rel="stylesheet" href="css/mobile.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #12305A; background: #F6F8FB; }
a { color: #1E5AA8; } a:hover { color: #12305A; }
.wrap { min-height: 100vh; display: flex; flex-wrap: wrap; }
.side { flex: 1 1 420px; background: #12305A; color: #FFFFFF; padding: 56px 6%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.main { flex: 1 1 460px; padding: 48px 5%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.box { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 20px; }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.role { min-height: 96px; padding: 14px 8px; border-radius: 14px; border: 2px solid #E2E7EF; background: #FFFFFF; color: #12305A; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; }
.role:hover { border-color: #A9C3EA; }
.role[aria-pressed="true"] { border-color: #12305A; background: #12305A; color: #FFFFFF; }
.role[aria-pressed="true"] svg { stroke: #FFC23D; }
form { background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
label { font-size: 14px; font-weight: 600; }
input { height: 48px; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 16px; font-family: inherit; box-sizing: border-box; width: 100%; }
.field { display: flex; flex-direction: column; gap: 6px; }
.go { height: 50px; border: none; border-radius: 10px; background: #F2A300; color: #12305A; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
.go:disabled { opacity: 0.6; cursor: wait; }
.link-btn { background: none; border: none; padding: 0; color: #1E5AA8; font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; align-self: flex-start; min-height: 24px; }
#msg { margin: 0; font-weight: 600; font-size: 14px; }
.eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; border-radius: 8px; background: transparent; color: #5B6472; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.eye:hover, .eye:focus-visible { color: #12305A; background: #EEF1F6; }
</style>
</head>
<body>
<div class="wrap">
<section class="side">
<div style="display: flex; align-items: center; gap: 12px">
<img src="images/logo-mark-light.svg" alt="" width="44" height="44">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">Clas<span style="color: #FFC23D">Pules</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 18px; max-width: 480px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 42px; line-height: 1.1">Every student's progress, in one place.</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D6DEEA">Teachers record attendance and scores. The headmaster sees the whole school. Parents follow their own child's progress.</p>
</div>
<p style="margin: 0; font-size: 14px; color: #D6DEEA">Need an account? Please speak to the headmaster.</p>
</section>

<main class="main">
<div class="box">
<div>
<h2 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 28px">Log in</h2>
<p style="margin: 0; color: #5B6472">Who are you logging in as?</p>
</div>

<div class="roles" role="group" aria-label="Choose who you are">
<button type="button" class="role" data-role="teacher" aria-pressed="true">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E5AA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M7 20h10"></path><path d="M12 16v4"></path></svg>
Teacher</button>
<button type="button" class="role" data-role="headmaster" aria-pressed="false">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E5AA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V9l7-5 7 5v12"></path><path d="M10 21v-6h4v6"></path></svg>
Headmaster</button>
<button type="button" class="role" data-role="parent" aria-pressed="false">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E5AA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"></circle><circle cx="17" cy="9" r="2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M15 20c0-2 1-3.5 2-4 1.7.3 4 1.7 4 4"></path></svg>
Parent</button>
</div>

<form id="login-form" novalidate>
<div class="field">
<label for="login-id" id="login-label">Email</label>
<input id="login-id" type="email" autocomplete="username" required>
</div>
<div class="field">
<label for="login-pass" id="pass-label">Password</label>
<div style="position: relative">
<input id="login-pass" type="password" autocomplete="current-password" required style="padding-right: 56px">
<button type="button" id="show-pass" class="eye" aria-label="Show password" aria-pressed="false">
<svg class="eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg class="eye-shut" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.3"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
</button>
</div>
</div>
<button type="submit" class="go" id="go-btn">Log in as Teacher</button>
<button type="button" class="link-btn" id="forgot-btn">Forgot your password?</button>
<p id="msg" role="status" aria-live="polite"></p>
</form>
<button type="button" class="link-btn" id="admin-link" style="align-self: center; color: #5B6472; font-size: 13px">ClasPules admin? Log in here</button>
</div>
</main>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
