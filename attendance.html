<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClasPules helps teachers record attendance and scores and follow each student's progress over the term.">
<title>ClasPules — take attendance</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/mobile.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5AA8}a:hover{color:#12305A}
.att-btn{height:44px;min-width:84px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;background:#FFFFFF;color:#5B6472;border:1px solid #C9D2DF}
.att-btn.on-P{background:#157F3B;color:#FFFFFF;border-color:#157F3B}
.att-btn.on-A{background:#B42318;color:#FFFFFF;border-color:#B42318}
.att-btn.on-L{background:#F2A300;color:#12305A;border-color:#F2A300}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F6F8FB; font-family: Inter, system-ui, sans-serif; color: #12305A">
<header style="background: #12305A; padding: 0 24px">
<div style="max-width: 1200px; margin: 0 auto; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 10px 0; box-sizing: border-box">
<a href="dashboard.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none"><img src="images/logo-mark-light.svg" alt="" width="32" height="32"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF">Clas<span style="color: #FFC23D">Pules</span></span></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
<a href="dashboard.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Dashboard</a>
<a href="record-scores.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Record scores</a>
<a href="topics.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Topics</a>
<a href="students.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Students</a>
<a href="class-lists.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 8px">Class lists</a></nav>
<div id="user-box" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #FFFFFF; font-size: 14px"></div>
</div>
</header>
<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px">Take attendance</h1>
<p style="margin: 0; font-size: 15px; color: #5B6472">Pick a class and date. Everyone starts as present — tap Absent or Late for anyone who isn't, then save.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px"><label for="att-class" style="font-size: 14px; font-weight: 600">Class</label><select id="att-class" style="height: 46px; padding: 0 12px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 15px; font-family: inherit; background: #FFFFFF"><option value="">Loading classes…</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px"><label for="att-date" style="font-size: 14px; font-weight: 600">Date</label><input id="att-date" type="date" style="height: 46px; padding: 0 12px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 15px; font-family: inherit; background: #FFFFFF; box-sizing: border-box"></div>
<button type="button" id="all-present" style="height: 46px; padding: 0 18px; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9D2DF; color: #12305A; font-weight: 600; font-size: 14px; font-family: inherit; cursor: pointer">Mark all present</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #E3F4E8; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #115E2C">Present</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: #115E2C"><span id="count-present">0</span></span></div>
<div style="background: #FDE8E7; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #8F1D15">Absent</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: #8F1D15"><span id="count-absent">0</span></span></div>
<div style="background: #FFF4D6; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #6B4E00">Late</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: #6B4E00"><span id="count-late">0</span></span></div>
</div>
<section id="student-list" aria-live="polite" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 16px; padding: 8px 24px">
<p style="color: #5B6472">Loading students…</p>
</section>
<div class="sticky-save" style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 16px">
<p id="save-status" role="status" style="margin: 0; align-self: center; font-weight: 600"></p>
<button type="button" id="delete-btn" hidden style="height: 48px; padding: 0 18px; border-radius: 10px; background: #FFFFFF; border: 1px solid #F1B8B3; color: #8F1D15; font-weight: 600; font-size: 14px; font-family: inherit; cursor: pointer">Delete this register</button>
<button type="button" id="save-btn" style="height: 48px; padding: 0 24px; border-radius: 10px; background: #F2A300; color: #12305A; font-weight: 700; font-size: 15px; text-decoration: none; display: flex; align-items: center; border: none; font-family: inherit; cursor: pointer">Save attendance</button>
</div>
</main>
</div>
<script type="module" src="js/attendance.js"></script>
</body>
</html>
